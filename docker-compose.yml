# docker compose up
#
# Starts PostgreSQL 17 with pg_stat_statements, seeds the synthetic shop database (300k orders, 900k lines),
# captures the catalog on "main", applies a pull request that drops an index, switches to OFFSET pagination and
# adds a covering index, captures again and prints the plan-guard report. The demo container exits 0 when
# plan-guard caught both regressions and reported the improvement. The PR comment Markdown, the JSON report and
# both snapshots stay in the container: docker compose cp demo:/out ./demo-output

name: plan-guard

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan-guard-demo}
    ports:
      - "127.0.0.1:${PLANGUARD_PG_PORT:-55931}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo:
    build: .
    image: plan-guard:demo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLANGUARD_ADMIN_CONNECTION: "Host=postgres;Username=postgres;Password=${POSTGRES_PASSWORD:-plan-guard-demo};Timeout=60;Command Timeout=600;GSS Encryption Mode=Disable"
    entrypoint: ["dotnet", "/app/lab/plan-guard-lab.dll"]
    command: ["demo", "--out", "/out", "--samples", "/app/samples/shop"]
